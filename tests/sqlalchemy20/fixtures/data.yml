Company:
  ACME:
    name: "ACME"

  FANG:
    name: "FANG"

Employee:
  acme1:
    first_name: {{ faker.unique.first_name() }}
    last_name: {{ faker.unique.last_name() }}
    company: Company(ACME)

  acme2:
    first_name: {{ faker.unique.first_name() }}
    last_name: {{ faker.unique.last_name() }}
    company: Company(ACME)

  fang1:
    first_name: {{ faker.unique.first_name() }}
    last_name: {{ faker.unique.last_name() }}
    company: Company(FANG)

  fang2:
    first_name: {{ faker.unique.first_name() }}
    last_name: {{ faker.unique.last_name() }}
    company: Company(FANG)

Manager:
  acme_boss:
    first_name: Boss
    last_name: Man (ACME)
    company: Company(ACME)
    reports:
      - Employee(acme1)
      - Employee(acme2)

  fang_boss:
    first_name: Boss
    last_name: Man (FANG)
