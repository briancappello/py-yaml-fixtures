[tool.poetry]
name = "py-yaml-fixtures"
version = "0.7.0a0"
description = "Load Django and SQLAlchemy database fixtures from Jinja2-templated YAML files"
authors = ["Brian Cappello <briancappello@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.urls]
Repository = "https://github.com/briancappello/py-yaml-fixtures"

[tool.poetry.dependencies]
python = "^3.10"
faker = "^33.1.0"
jinja2 = "^3.1.5"
networkx = "^3.4.2"
pyyaml = "^6.0.2"
python-dateutil = "^2.9.0.post0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
flask = "^3.1.0"
django = "^5.1.4"
sqlalchemy = "<2.0"
flask-unchained = { version = "^0.10.0a2", extras = ["sqlalchemy"] }
pytest-django = "^4.9.0"
sqlalchemy-unchained = "^0.14.0"
flask-sqlalchemy-unchained = "^0.8.0"
flask-migrate = "^4.0.7"
wtforms-sqlalchemy = "^0.4.2"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.1.3"
sphinx-autobuild = "^2024.10.3"
sphinx-rtd-theme = "^3.0.2"
sqlalchemy = "<2"
myst-parser = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"
addopts = "-s"
django_find_project = false
DJANGO_SETTINGS_MODULE = "django_test_app.settings"
