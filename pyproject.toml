[project]
name = "py-yaml-fixtures"
version = "0.7.0a0"
description = "Load Django and SQLAlchemy database fixtures from Jinja2-templated YAML files"
authors = [{ name = "Brian Cappello", email = "briancappello@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "faker>=33.1.0,<34",
    "jinja2>=3.1.5,<4",
    "networkx>=3.4.2,<4",
    "pyyaml>=6.0.2,<7",
    "python-dateutil>=2.9.0.post0,<3",
]

[project.urls]
Repository = "https://github.com/briancappello/py-yaml-fixtures"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9",
    "flask>=3.1.0,<4",
    "django>=5.1.4,<6",
    "sqlalchemy<2.0",
    "flask-unchained[sqlalchemy]>=0.10.0a2,<0.11",
    "pytest-django>=4.9.0,<5",
    "sqlalchemy-unchained>=0.14.0,<0.15",
    "flask-sqlalchemy-unchained>=0.8.0,<0.9",
    "flask-migrate>=4.0.7,<5",
    "wtforms-sqlalchemy>=0.4.2,<0.5",
]
docs = [
    "sphinx>=8.1.3,<9",
    "sphinx-autobuild>=2024.10.3,<2025",
    "sphinx-rtd-theme>=3.0.2,<4",
    "sqlalchemy<2",
    "myst-parser>=4.0.0,<5",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = "tests"
addopts = "-s"
django_find_project = false
DJANGO_SETTINGS_MODULE = "django_test_app.settings"
